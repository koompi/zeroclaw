workspace_dir = "/zeroclaw-data/workspace"
config_path = "/zeroclaw-data/.zeroclaw/config.toml"
# This is the Ollama Base URL, not a secret key
api_key = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "llama3.2"
default_temperature = 0.7

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true

# Container-optimized autonomy: the Docker container IS the sandbox
[autonomy]
level = "full"
workspace_only = false
require_approval_for_medium_risk = false
block_high_risk_commands = false
container_mode = true
max_actions_per_hour = 1000
max_cost_per_day_cents = 5000
allowed_commands = [
  "git", "npm", "npx", "cargo", "node", "bun",
  "ls", "cat", "grep", "find", "echo", "pwd", "wc", "head", "tail", "date",
  "curl", "wget",
  "python3", "pip3", "pip",
  "zip", "unzip", "tar", "gzip",
  "chromium", "chromium-browser",
  "pdftotext", "pdfinfo", "pdftoppm",
  "mkdir", "cp", "mv", "rm", "chmod", "touch", "sed", "awk", "sort", "uniq", "tr", "cut", "tee",
  "env", "which", "xargs", "diff", "patch",
  "jq", "base64", "sha256sum", "md5sum",
  "bash", "sh", "stat", "file", "realpath", "dirname", "basename", "readlink",
  "*"
]
forbidden_paths = []
allowed_roots = ["/zeroclaw-data", "/tmp", "/home/zeroclaw"]
auto_approve = ["file_read", "memory_recall", "shell"]
always_ask = []

# Enable HTTP request tool for API calls
[http_request]
enabled = true
allowed_domains = ["*"]
timeout_secs = 60

# Enable web fetch tool for browsing
[web_fetch]
enabled = true
allowed_domains = ["*"]
blocked_domains = []
timeout_secs = 30

# Voice transcription via KConsole AI Gateway (OpenAI Whisper-compatible)
[transcription]
enabled = true
api_url = "https://ai.koompi.cloud/v1/audio/transcriptions"
model = "whisper-1"
max_duration_secs = 120
