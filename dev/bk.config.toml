allow_public_bind = true
require_pairing = false

[gateway]
host = "0.0.0.0"

[providers.custom]
base_url = "https://ai.koompi.cloud/v1"
api_key = "${ZEROCLAW_API_KEY}"

[agent]
max_tool_iterations = 50
parallel_tools = true

[agent.thinking]
enabled = true
level = "medium"

[media_pipeline]
enabled = true
transcribe_audio = true

[transcription]
enabled = true
default_provider = "local_whisper"


[transcription.local_whisper]
url = "https://ai.koompi.cloud/v1/audio/transcriptions"
bearer_token = "${ZEROCLAW_API_KEY}"
language = "km"

[channels.telegram]
enabled = true
bot_token = "${ZEROCLAW_TELEGRAM_BOT_TOKEN}"
allowed_users = ["${ZEROCLAW_TELEGRAM_ALLOWED_USERS}"]
stream_mode = "partial"
interrupt_on_new_message = true
mention_only = false
draft_update_interval_ms = 1000


